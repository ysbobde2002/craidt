name: Update model tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - assets/model-tracker.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tracker SVG
        run: node scripts/generate-model-tracker.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/model-tracker.svg
          if git diff --staged --quiet; then
            echo "Tracker unchanged"
          else
            git commit -m "chore: refresh model tracker"
            git push
          fi
